services:
  redis:
    image: redis:7-alpine
    container_name: zhihu-summary-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: zhihu-summary-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: zhihu_summary
      POSTGRES_USER: zhihu_summary
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhihu_summary -d zhihu_summary"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
  postgres-data:

